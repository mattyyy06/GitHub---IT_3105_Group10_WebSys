<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Tables</h1>
    <table border="1">
    <tr>
        <th>Number</th>
        <th>Item</th>
        <th>Quantity</th>
    </tr>
    <tr>
        <td>1</td>
        <td>Apple</td>
        <td rowspan="3">5</td>
    </tr>
    <tr>
        <td>2</td>
        <td>Mango</td>
    </tr>
    <tr>
        <td>3</td>
        <td>Orange</td>
    </tr>
    <tr>
        <td colspan="2">Total</td>
        <td>5</td>
    </tr>
</table>

<br>
<hr>

<h1>Inline and Block Elements</h1>

<p>This is how <span style="border: 1px solid black">span</span> works. </p>
<p>The following spans will be  inline; <span style="border: 1px solid black">Span 1</span> and
<span style="border: 1px solid black;">Span 2</span>.</p>
<p>Formatting tags like b, strong, em are also inline elements.</p>


<br>
<hr>
<br>

<h1>Semantic Elements</h1>

<style>
    h1 {
        color: rgb(255, 0, 175);
    }
    .div1 {
        color: rgb(98, 12, 36);
    } 
    .div2 {
        color: rgb(177, 150, 0);
    }

</style>

</body>
</html>
